{% extends 'base.html' %}
{% load static %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block cuerpo %}
<div class="login-fondo d-flex align-items-center justify-content-center p-3">
  <div class="card login-caja shadow w-100">
    <div class="encabezado text-center py-3">
      <img src="{% static 'img/logo.png' %}" alt="El Salinero">
    </div>
    <div class="card-body p-4">
      <h1 class="h5 text-center mb-1">Sistema Salinerito</h1>
      <p class="text-center text-muted small mb-4">Uso interno del restaurante</p>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <label class="form-label small fw-bold" for="id_username">Usuario</label>
        <input class="form-control mb-3" type="text" name="username" id="id_username" required autofocus>
        <label class="form-label small fw-bold" for="id_password">Contraseña</label>
        <input class="form-control mb-4" type="password" name="password" id="id_password" required>
        <button class="btn btn-salinero w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
